{% extends "base.html" %}

{% block content %}
<h1>Payment canceled</h1>
<p>Order #{{ order.pk }} was created, but Stripe payment was canceled.</p>
<a href="{% url 'order:create_checkout_session' order.pk %}" class="btn btn-success">Try again</a>
<a href="{% url 'order:order_success' order.pk %}" class="btn btn-outline-primary">View order</a>
{% endblock %}
