{% extends "base.html" %}

{% block content %}
<div class="auth-form">
    <h1>Реєстрація</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Зареєструватися</button>
    </form>
    <a href="/login/" class="switch-link">Вже є акаунт? Увійти</a>
</div>
{% endblock %}
