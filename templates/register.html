{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="auth-form">
    <h1>{% trans "Register" %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">{% trans "Register" %}</button>
    </form>
    <a href="{% url 'login' %}" class="switch-link">{% trans "Already have an account? Login" %}</a>
</div>
{% endblock %}
