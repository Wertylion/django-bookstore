<!DOCTYPE html>
<html>
<head>
    <title>{{ category.name }}</title>
</head>
<body>
    <h1>{{ category.name }}</h1>

    {% for book in books %}
        <div>
            <h2>{{ book.title }}</h2>
            <p>Price: {{ book.price }}</p>
        </div>
    {% empty %}
        <p>No books in this category.</p>
    {% endfor %}
</body>
</html>
